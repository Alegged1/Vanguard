<style>
:root {
  --navy-950: #060b20;
  --navy-900: #0b1438;
  --navy-850: #0f1a47;
  --navy-800: #13235a;
  --navy-700: #1c3174;
  --ice: #a9dcf5;
  --ice-deep: #7cc4ea;
  --silver: #c3c7cf;
  --steel: #8a8f99;
  --paper: #f4f4f4;
  --lavender: #b9b3d6;
  --danger: #f39a9a;

  --text: #e6e9f0;
  --text-dim: #a3abbd;
  --line: rgba(195, 199, 207, 0.28);
  --line-strong: rgba(195, 199, 207, 0.55);
  --glow: 0 0 0 1px rgba(169, 220, 245, 0.55), 0 0 28px rgba(124, 196, 234, 0.28), 0 12px 40px rgba(0, 0, 0, 0.45);

  --font-display: "Cinzel", "Trajan Pro", "Times New Roman", serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 6px;
  --gutter: 16px;
  --nav-h: 56px;
  --editor-w: 0px;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: var(--nav-h); }
html.view-players { scroll-snap-type: y proximity; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--text);
  background-color: var(--navy-950);
  background-image:
    radial-gradient(ellipse 80% 55% at 50% -5%, rgba(28, 49, 116, 0.85), transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 8%, rgba(124, 196, 234, 0.10), transparent 70%),
    linear-gradient(180deg, var(--navy-900) 0%, var(--navy-950) 60%);
  background-attachment: fixed;
  line-height: 1.5;
  overflow-x: hidden;
}
body::before { /* faint diamond lattice, like a heraldic field */
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  opacity: 0.05;
  background-image:
    linear-gradient(45deg, var(--silver) 1px, transparent 1px),
    linear-gradient(-45deg, var(--silver) 1px, transparent 1px);
  background-size: 34px 34px;
  mask-image: linear-gradient(180deg, #000 0%, transparent 75%);
  -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 75%);
}
a { color: var(--ice); }
.page { position: relative; padding-right: var(--editor-w); transition: padding-right .25s ease; }
[hidden] { display: none !important; }

/* ---------- Top bar with tabs ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  height: var(--nav-h);
  display: flex; align-items: center; gap: 12px;
  padding: 0 var(--gutter);
  background: rgba(8, 14, 40, 0.82);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex; align-items: center; gap: 9px;
  color: var(--paper); text-decoration: none;
  font-family: var(--font-display); font-weight: 700; letter-spacing: .16em; font-size: .95rem;
  min-width: 0;
}
.brand img { width: 32px; height: 30px; object-fit: contain; flex: none; }
.tabs { display: flex; gap: 4px; margin: 0 auto; }
.tab {
  position: relative;
  padding: 8px 16px;
  font-family: var(--font-display); font-weight: 700; font-size: .82rem; letter-spacing: .18em; text-transform: uppercase;
  color: var(--text-dim); text-decoration: none;
  border-radius: 4px;
}
.tab:hover { color: var(--paper); }
.tab[aria-current="page"] { color: var(--paper); }
.tab[aria-current="page"]::after {
  content: ""; position: absolute; left: 14px; right: 14px; bottom: 2px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--ice), transparent);
}
.tab:focus-visible, .brand:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
.nav-right { display: flex; align-items: center; gap: 8px; flex: none; }
@media (max-width: 640px) {
  .brand span { display: none; }
  .tabs { margin: 0 auto 0 4px; }
  .tab { padding: 8px 10px; font-size: .74rem; letter-spacing: .12em; }
  .tab[aria-current="page"]::after { left: 8px; right: 8px; }
  .discord-btn .label-long { display: none; }
}

.discord-btn {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 36px; padding: 7px 14px;
  font: 700 .8rem/1 var(--font-body); letter-spacing: .04em;
  color: var(--navy-900); text-decoration: none;
  background: linear-gradient(180deg, #c9ebfb, var(--ice-deep));
  border-radius: 4px;
  box-shadow: 0 0 16px rgba(124, 196, 234, 0.25);
  transition: box-shadow .2s ease, transform .2s ease;
}
.discord-btn:hover { box-shadow: 0 0 24px rgba(124, 196, 234, 0.5); transform: translateY(-1px); }
.discord-btn svg { width: 17px; height: 17px; flex: none; }
.discord-btn.big { min-height: 44px; padding: 10px 20px; font-size: .9rem; margin-top: 20px; }

/* ---------- Header ---------- */
.hero {
  text-align: center;
  padding: clamp(24px, 5vw, 56px) var(--gutter) 12px;
}
.crest-wrap { position: relative; display: inline-block; }
.crest-wrap::before {
  content: "";
  position: absolute; inset: 12% 10%;
  background: radial-gradient(closest-side, rgba(124, 196, 234, 0.30), transparent);
  filter: blur(18px);
  z-index: -1;
}
.crest {
  display: block;
  width: min(380px, 72vw);
  height: auto;
  filter: drop-shadow(0 16px 30px rgba(0, 0, 0, 0.55));
}
.team-name {
  margin: 18px 0 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2.4rem, 8vw, 4.4rem);
  letter-spacing: 0.18em;
  line-height: 1.05;
  padding-left: 0.18em;
  background: linear-gradient(180deg, #ffffff 0%, var(--paper) 35%, var(--silver) 65%, var(--steel) 100%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.55));
}
.tagline {
  margin: 10px 0 0;
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  font-size: clamp(0.72rem, 2.4vw, 0.9rem);
  color: var(--ice);
}
.welcome {
  position: relative;
  max-width: 640px; margin: 28px auto 0;
  padding: 22px 26px 20px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(180deg, rgba(19, 35, 90, 0.55), rgba(11, 20, 56, 0.6));
  text-align: center;
}
.welcome::before {
  content: ""; position: absolute; left: 20%; right: 20%; top: -1px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--ice), transparent);
}
.welcome p { margin: 0; font-size: 1.02rem; line-height: 1.65; color: var(--text); white-space: pre-line; }
.welcome .by { margin-top: 12px; font-family: var(--font-display); font-size: .8rem; letter-spacing: .18em; text-transform: uppercase; color: var(--ice); }
.welcome .by::before { content: "— "; }
.welcome.is-placeholder p { color: var(--steel); font-style: italic; }
.divider {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  margin: 30px auto 0; max-width: 520px;
}
.divider::before, .divider::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, var(--line-strong));
}
.divider::after { background: linear-gradient(270deg, transparent, var(--line-strong)); }
.divider span { font-family: var(--font-display); font-size: .78rem; letter-spacing: .24em; text-transform: uppercase; color: var(--text-dim); white-space: nowrap; }

/* ---------- Roster grid ---------- */
.roster {
  max-width: 1240px;
  margin: 0 auto;
  padding: 28px var(--gutter) 56px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(218px, 1fr));
  gap: 20px;
}
@media (max-width: 560px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
}
@media (max-width: 300px) {
  .grid { grid-template-columns: 1fr; }
}

/* ---------- Card ---------- */
.card {
  position: relative;
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(19, 35, 90, 0.72), rgba(11, 20, 56, 0.88));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  transition: box-shadow .25s ease, border-color .25s ease, transform .25s ease;
  outline: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.card:hover, .card:focus-visible, .card.is-open {
  border-color: rgba(169, 220, 245, 0.6);
  box-shadow: var(--glow);
}
@media (hover: hover) and (pointer: fine) {
  .card:hover { transform: translateY(-3px); }
}
.card.is-owner, .card.is-manager {
  border-color: rgba(195, 199, 207, 0.5);
  background:
    linear-gradient(180deg, rgba(169, 220, 245, 0.10), transparent 40%),
    linear-gradient(180deg, rgba(19, 35, 90, 0.8), rgba(11, 20, 56, 0.9));
}
.card.is-manager { background: linear-gradient(180deg, rgba(185, 179, 214, 0.10), transparent 40%), linear-gradient(180deg, rgba(19, 35, 90, 0.8), rgba(11, 20, 56, 0.9)); }
.card.is-owner::before, .card.is-manager::before {
  content: ""; position: absolute; left: 12px; right: 12px; top: -1px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--ice), transparent);
}
.card.is-manager::before { background: linear-gradient(90deg, transparent, var(--lavender), transparent); }

.card-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  min-height: 44px;
}
.name-block { min-width: 0; }
.player-name {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(0.92rem, 3.6vw, 1.12rem);
  letter-spacing: 0.04em;
  color: var(--paper);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rank {
  display: block;
  font-size: 0.66rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-dim);
  margin-top: 1px;
}
.role-badge { display: inline-flex; align-items: center; gap: 5px; color: var(--ice); }
.role-badge.manager { color: var(--lavender); }
.role-badge svg { width: 14px; height: 14px; flex: none; }

.quips { flex: none; text-align: right; line-height: 1; }
.quips-value {
  display: block;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(1.35rem, 5vw, 1.7rem);
  letter-spacing: 0.02em;
  color: var(--ice);
  text-shadow: 0 0 14px rgba(124, 196, 234, 0.45);
}
.quips-label {
  display: block; margin-top: 3px;
  font-size: 0.58rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--text-dim);
}
.quips[data-tier="high"] .quips-value { color: #d9f2ff; text-shadow: 0 0 16px rgba(169, 220, 245, 0.8); }
.quips[data-tier="low"] .quips-value { color: var(--silver); text-shadow: none; }
.quips.is-none .quips-value { color: var(--steel); text-shadow: none; }
.role-mark {
  flex: none;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border: 1px solid rgba(169, 220, 245, 0.55);
  border-radius: 50%;
  color: var(--ice);
  background: radial-gradient(circle, rgba(169, 220, 245, 0.18), transparent 70%);
  box-shadow: 0 0 14px rgba(124, 196, 234, 0.35);
}
.role-mark.manager { color: var(--lavender); border-color: rgba(185, 179, 214, 0.6); background: radial-gradient(circle, rgba(185, 179, 214, 0.18), transparent 70%); box-shadow: 0 0 14px rgba(185, 179, 214, 0.3); }
.role-mark svg { width: 20px; height: 20px; }

.meter {
  height: 2px; margin: 8px 0 10px;
  background: rgba(195, 199, 207, 0.15);
  border-radius: 2px; overflow: hidden;
}
.meter i {
  display: block; height: 100%; width: var(--pct, 0%);
  background: linear-gradient(90deg, var(--ice-deep), var(--ice));
  box-shadow: 0 0 8px var(--ice-deep);
  transition: width .4s ease;
}
.meter.full i { width: 100%; background: linear-gradient(90deg, var(--lavender), var(--silver), var(--ice)); box-shadow: none; }

/* The framed skin stage */
.stage {
  position: relative;
  aspect-ratio: 3 / 4;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  background:
    radial-gradient(ellipse 70% 55% at 50% 42%, rgba(124, 196, 234, 0.16), transparent 70%),
    linear-gradient(180deg, rgba(6, 11, 32, 0.35), rgba(6, 11, 32, 0.75));
  overflow: hidden;
  touch-action: pan-y; /* horizontal drags spin the model; vertical swipes still scroll */
  cursor: grab;
  user-select: none; -webkit-user-select: none;
}
.stage.is-dragging { cursor: grabbing; }
.stage::before, .stage::after {
  content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none; z-index: 2;
  border: 1px solid var(--silver);
  opacity: .75;
}
.stage::before { left: 5px; top: 5px; border-right: 0; border-bottom: 0; }
.stage::after { right: 5px; bottom: 5px; border-left: 0; border-top: 0; }
.stage .floor {
  position: absolute; left: 22%; right: 22%; bottom: 7%; height: 7%;
  background: radial-gradient(closest-side, rgba(0, 0, 0, 0.55), transparent);
  pointer-events: none;
}
.stage canvas, .stage img.flat {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
}
.stage img.flat { object-fit: contain; padding: 10% 14%; image-rendering: pixelated; }
.stage .loading {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  transition: opacity .3s ease;
}
.stage .loading::before {
  content: ""; width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid rgba(195, 199, 207, 0.2); border-top-color: var(--ice);
  animation: spin 0.9s linear infinite;
}
.stage.is-ready .loading { opacity: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Card quote: hover on desktop, tap on touch */
.bio {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
  padding: 26px 12px 12px;
  background: linear-gradient(180deg, transparent, rgba(6, 11, 32, 0.86) 26%, rgba(6, 11, 32, 0.95));
  font-size: 0.82rem; line-height: 1.45;
  color: var(--text);
  opacity: 0; transform: translateY(10px);
  transition: opacity .25s ease, transform .25s ease;
  pointer-events: none;
}
.bio p { margin: 0; }
.quote::before { content: "“"; font-family: var(--font-display); color: var(--ice); font-size: 1.3em; line-height: 0; margin-right: 2px; vertical-align: -0.12em; }
.quote::after { content: "”"; font-family: var(--font-display); color: var(--ice); font-size: 1.3em; line-height: 0; margin-left: 2px; vertical-align: -0.12em; }
.is-placeholder .quote, .quote.is-placeholder { color: var(--text-dim); font-style: italic; }
.bio .more {
  display: block; margin-top: 8px;
  font-size: .68rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
  color: var(--ice);
}
.card.is-open .bio, .card:focus-visible .bio { opacity: 1; transform: none; }
@media (hover: hover) and (pointer: fine) {
  .card:hover .bio { opacity: 1; transform: none; }
}
.tap-hint {
  position: absolute; right: 7px; bottom: 7px; z-index: 2;
  width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center;
  font: 700 12px/1 var(--font-display);
  color: var(--navy-900); background: var(--silver);
  opacity: .8; pointer-events: none;
  transition: opacity .2s ease;
}
@media (hover: hover) and (pointer: fine) { .tap-hint { display: none; } }
.card.is-open .tap-hint { opacity: 0; }

.card-title {
  margin: 10px 0 0;
  min-height: 1.5em;
  text-align: center;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(0.8rem, 3.2vw, 0.95rem);
  letter-spacing: 0.08em;
  color: var(--silver);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-title.is-placeholder { color: var(--steel); font-weight: 500; letter-spacing: .2em; text-transform: uppercase; font-size: .7rem; padding-top: .2em; }

@media (max-width: 560px) {
  .card { padding: 9px; }
  .card-head { min-height: 40px; }
  .role-mark { width: 32px; height: 32px; }

  function render() {
    renderTeam();
    var n = state.members.length;
    document.getElementById("member-count").textContent = "The Roster · " + n + (n === 1 ? " member" : " members");

    var sorted = sortMembers(state.members);
    var used = {};
    sorted.forEach(function (m) {
      var s = slugify(m.name), base = s, i = 2;
      while (used[s]) s = base + "-" + i++;
      used[s] = true; slugById[m._id] = s;
    });

    // FLIP: remember where cards were so reordering animates smoothly
    var before = {};
    Object.keys(cardsById).forEach(function (id) { before[id] = cardsById[id].el.getBoundingClientRect(); });

    var alive = {};
    sorted.forEach(function (m, i) {
      alive[m._id] = true;
      var slot = getSlot(m._id);
      var c = cardsById[m._id], isNew = !c;
      if (isNew) c = cardsById[m._id] = createCard(m);
      var p = profilesById[m._id];
      if (!p) { p = profilesById[m._id] = createProfile(m); if (profileIO) profileIO.observe(p.el); }
      updateCard(c, m);
      updateProfile(p, m, i, sorted.length, sorted[i + 1]);
      setSlotSkin(slot, skinNameOf(m), m.skinFile || "", isNew);
      if (grid.children[i] !== c.el) grid.insertBefore(c.el, grid.children[i] || null);
      if (profilesEl.children[i] !== p.el) profilesEl.insertBefore(p.el, profilesEl.children[i] || null);
      if (railEl.children[i] !== p.railDot) railEl.insertBefore(p.railDot, railEl.children[i] || null);
    });
    Object.keys(cardsById).forEach(function (id) {
      if (alive[id]) return;
      var c = cardsById[id], p = profilesById[id];
      dropTarget(c.target); dropTarget(p.target);
      if (profileIO) profileIO.unobserve(p.el);
      c.el.remove(); p.el.remove(); p.railDot.remove();
      var slot = Engine.slots[id]; if (slot && slot.tex) slot.tex.dispose();
      delete Engine.slots[id]; delete cardsById[id]; delete profilesById[id];
      if (openCard === c) openCard = null;
    });
    queueSize();

    if (!reduceMotion && currentView === "roster") {
      Object.keys(before).forEach(function (id) {
        var c = cardsById[id]; if (!c) return;
        var a = before[id], b = c.el.getBoundingClientRect();
        var dx = a.left - b.left, dy = a.top - b.top;
        if (!dx && !dy) return;
        c.el.style.transition = "none";
        c.el.style.transform = "translate(" + dx + "px," + dy + "px)";
        requestAnimationFrame(function () {
          c.el.style.transition = "transform .35s ease, box-shadow .25s ease, border-color .25s ease";
          c.el.style.transform = "";
          setTimeout(function () { c.el.style.transition = ""; }, 400);
        });
      });
    }
  }

  /* ---------------- Tabs / routing (#roster, #players, #players/<name>) ---------------- */
  var currentView = "roster", rosterScroll = 0;
  function route() {
    var h = decodeURIComponent(location.hash.replace(/^#/, ""));
    var view = h.indexOf("players") === 0 ? "players" : "roster";
    var slug = view === "players" ? h.split("/")[1] : null;
    if (view !== currentView) {
      if (currentView === "roster") rosterScroll = window.scrollY;
      currentView = view;
      document.getElementById("view-roster").hidden = view !== "roster";
      document.getElementById("view-players").hidden = view !== "players";
      document.documentElement.classList.toggle("view-players", view === "players");
      if (openCard) setOpen(openCard, false);
    }
    document.querySelectorAll(".tab").forEach(function (t) {
      if (t.getAttribute("data-view") === view) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
    });
    sizeTargets();
    if (view === "players") {
      var target = slug && document.getElementById("player-" + slug);
      if (target) target.scrollIntoView({ block: "start" });
      else window.scrollTo(0, 0);
    } else {
      window.scrollTo(0, h === "roster" ? 0 : rosterScroll);
    }
  }
  window.addEventListener("hashchange", route);
  document.querySelector('.tab[data-view="roster"]').addEventListener("click", function (e) {
    if (currentView === "roster") { e.preventDefault(); window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); }
  });

  // tap outside an open card closes its quote
  document.addEventListener("pointerdown", function (e) {

  });

  /* ---------------- Edit mode ---------------- */
  var Editor = { focusMember: null };

  function rowErrors(m) {
    var out = [];

    if (m.role !== "owner" && !ratingValid(m.rating)) out.push("rating must be 0.1 – 2.0 or blank");
    if (m.links.some(function (u) { return !safeUrl(u); })) out.push("one of the links isn't a valid web address");
    return out;
  }

  function initEditor() {
    document.body.classList.add("editing", "editor-open");
    var draft = null;
    try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch (e) { draft = null; }
    var notice = "";
    if (draft && draft.data) {
      var restored = normalize(draft.data);
      if (plain(restored) === plain(BAKED)) {
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      } else {
        state = restored;
        notice = "Restored your unsaved edits from " + new Date(draft.savedAt || Date.now()).toLocaleString() + ".";
        if (draft.base && draft.base !== hash(plain(BAKED))) notice += " Heads up: the published site has changed since these edits were made.";
      }
    }

    var panel = el("aside", "editor");
    panel.setAttribute("aria-label", "Site editor");
    panel.innerHTML =
      '<div class="editor-head">' +
        '<h2><span>Edit site</span><button type="button" class="btn btn-small" data-act="close">Hide</button></h2>' +
        '<p class="editor-status" data-ref="status">Changes preview instantly. Nothing is public until you upload.</p>' +
        '<div class="editor-actions">' +
          '<button type="button" class="btn btn-primary" data-act="download">⬇ Download updated site</button>' +
          '<button type="button" class="btn" data-act="add">+ Add member</button>' +
        '</div>' +
      '</div>' +
      '<div class="editor-body">' +
        '<div class="editor-notice" data-ref="notice" hidden><span data-ref="notice-text"></span><br>' +
          '<button type="button" class="btn btn-small btn-danger" data-act="discard">Discard my edits</button></div>' +
        '<h3 class="editor-section-title">Team</h3>' +

        '<div data-ref="list"></div>' +

      '</div>';
    document.body.appendChild(panel);

    var $ = function (ref) { return panel.querySelector('[data-ref="' + ref + '"]'); };

        localStorage.setItem(DRAFT_KEY, JSON.stringify({ savedAt: Date.now(), base: hash(plain(BAKED)), data: stripIds(state) }));

      ach.addEventListener("input", function () { m.achievements = list(ach.value); changed(); });
      links.addEventListener("input", function () { m.links = list(links.value); refresh(); changed(); });
      upBtn.addEventListener("click", function () { file.click(); });
      file.addEventListener("change", function () {
        var f = file.files && file.files[0]; file.value = "";
        if (!f) return;
        if (f.size > 200000) { alert("That file is too big to be a Minecraft skin."); return; }
        var reader = new FileReader();
        reader.onload = function () {
          var url = String(reader.result);
          if (!/^data:image\/png;base64,/.test(url)) { alert("Please choose a .png skin file."); return; }
          loadImage(url).then(function () {
            m.skinFile = url; refresh(); changed();
          }, function () { alert("That doesn't look like a Minecraft skin. Skin files are 64×64 (or 64×32) PNG images."); });
        };
        reader.readAsDataURL(f);
      });
      clearBtn.addEventListener("click", function () { m.skinFile = ""; refresh(); changed(); });
      del.addEventListener("click", function () {
        if (!confirm("Remove " + (m.name || "this member") + " from the roster?")) return;
        state.members.splice(state.members.indexOf(m), 1);
        d.remove(); delete rows[m._id];
        changed();
      });
      d.addEventListener("toggle", function () {
        [cardsById[m._id], profilesById[m._id]].forEach(function (x) { if (x) x.el.classList.toggle("is-selected", d.open); });
      });
      hookSkinStatus(m);
      return d;
    }

    function hookSkinStatus(m) {
      var slot = Engine.slots[m._id], r = rows[m._id];
      if (!slot || !r) return;
      var show = function (src) {
        r.statusEl.textContent = src === "default" ? "Skin not found — showing default skin" : src === "uploaded" ? "Using uploaded skin file" : "Skin loaded from " + src;
        r.statusEl.className = "skin-status" + (src === "default" ? " is-bad" : src === "uploaded" ? " is-up" : "");
      };
      slot.onStatus = show;
      if (slot.source) show(slot.source);
    }

    function buildList() {
      listEl.innerHTML = ""; rows = {};
      sortMembers(state.members).forEach(function (m) { listEl.appendChild(buildRow(m, false)); });
    }

    Editor.focusMember = function (id) {
      var r = rows[id]; if (!r) return;
      setPanel(true);
      Object.keys(rows).forEach(function (k) { if (rows[k] !== r) rows[k].el.open = false; });
      r.el.open = true;
      r.el.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
    };

    function addMember() {
      var m = normalizeMember({ name: "NewMember", skin: "", role: "member", rating: 1.0 });
      state.members.push(m);
      changed();
      listEl.appendChild(buildRow(m, true));
      Editor.focusMember(m._id);
      rows[m._id].name.focus(); rows[m._id].name.select();
    }

    panel.addEventListener("click", function (e) {
      var b = e.target.closest("[data-act]"); if (!b) return;
      var act = b.getAttribute("data-act");
      if (act === "close") setPanel(false);
      if (act === "add") addMember();
      if (act === "download") downloadSite();
      if (act === "discard") {
        if (!confirm("Throw away your unsaved edits and go back to the published version?")) return;
        try { localStorage.removeItem(DRAFT_KEY); } catch (err) {}
        state = normalize(stripIds(BAKED));
        $("notice").hidden = true;
        render(); buildTeam(); buildList();
        statusEl.textContent = "Back to the published version.";
      }
    });

    function downloadSite() {
      var problems = [];
      state.members.forEach(function (m) { rowErrors(m).forEach(function (p) { problems.push((m.name || "(no name)") + ": " + p); }); });
      if (state.team.discord && !safeUrl(state.team.discord)) problems.push("Discord link isn't a valid web address");
      if (!/^[A-Za-z0-9_-]*$/.test(state.team.editKey)) problems.push("Secret edit word: use only letters, numbers, - or _");
      if (problems.length) { alert("Please fix these first:\n\n" + problems.join("\n")); return; }
      getSource().then(function (src) {
        var a = src.indexOf(MARK_START), b = src.indexOf(MARK_END);
        if (a < 0 || b < a) throw new Error("data markers not found");
        var lineEnd = src.indexOf("\n", a);
        var out = src.slice(0, lineEnd + 1) + serialize(state) + "\n" + src.slice(b);
        var blob = new Blob([out], { type: "text/html;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var link = el("a"); link.href = url; link.download = "index.html";
        document.body.appendChild(link); link.click(); link.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        var k = state.team.editKey;
        toast("Saved <b>index.html</b>. Now upload it to your GitHub repository (Add file → Upload files → Commit changes). The site updates in about a minute." +
          (k ? "<br><br>Your edit link will be <b>?edit=" + k + "</b>" : ""), 11000);
      }).catch(function (err) {
        alert("Sorry, the download failed: " + err.message);
      });
    }

    render();
    buildTeam();
    buildList();
    if (!notice) saveDraft();
  }

  /* The page's own file: fetched fresh from GitHub Pages, or the startup snapshot as a fallback. */
  function getSource() {
    var valid = function (s) { return s && s.indexOf(MARK_START) >= 0 && s.indexOf(MARK_END) >= 0; };
    if (location.protocol === "file:") return Promise.resolve(PAGE_SNAPSHOT);
    return fetch(location.href.split(/[?#]/)[0], { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : ""; })
      .then(function (s) { return valid(s) ? s : PAGE_SNAPSHOT; }, function () { return PAGE_SNAPSHOT; });
  }

  var toastEl = null, toastTimer = null;
  function toast(html, ms) {
    if (!toastEl) { toastEl = el("div", "toast"); toastEl.setAttribute("role", "status"); document.body.appendChild(toastEl); }
    toastEl.innerHTML = html;
    toastEl.classList.add("is-on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("is-on"); }, ms || 5000);
  }

  /* ---------------- Start ---------------- */
  if (EDIT_MODE) {
    state = normalize(stripIds(BAKED)); // editable copy
    initEditor();
  } else {
    render();
  }
  route();
  initEngine();
})();
</script>
</body>
</html>
