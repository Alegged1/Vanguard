<style>
:root {
  --navy-950: #060b20;
  --navy-900: #0b1438;
  --navy-850: #0f1a47;
  --navy-800: #13235a;
  --navy-700: #1c3174;
  --ice: #a9dcf5;
  --ice-deep: #7cc4ea;
  --silver: #c3c7cf;
  --steel: #8a8f99;
  --paper: #f4f4f4;
  --lavender: #b9b3d6;
  --danger: #f39a9a;

  --text: #e6e9f0;
  --text-dim: #a3abbd;
  --line: rgba(195, 199, 207, 0.28);
  --line-strong: rgba(195, 199, 207, 0.55);
  --glow: 0 0 0 1px rgba(169, 220, 245, 0.55), 0 0 28px rgba(124, 196, 234, 0.28), 0 12px 40px rgba(0, 0, 0, 0.45);

  --font-display: "Cinzel", "Trajan Pro", "Times New Roman", serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 6px;
  --gutter: 16px;
  --editor-w: 0px;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--text);
  background-color: var(--navy-950);
  background-image:
    radial-gradient(ellipse 80% 55% at 50% -5%, rgba(28, 49, 116, 0.85), transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 8%, rgba(124, 196, 234, 0.10), transparent 70%),
    linear-gradient(180deg, var(--navy-900) 0%, var(--navy-950) 60%);
  background-attachment: fixed;
  line-height: 1.5;
  overflow-x: hidden;
}
body::before { /* faint diamond lattice, like a heraldic field */
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  opacity: 0.05;
  background-image:
    linear-gradient(45deg, var(--silver) 1px, transparent 1px),
    linear-gradient(-45deg, var(--silver) 1px, transparent 1px);
  background-size: 34px 34px;
  mask-image: linear-gradient(180deg, #000 0%, transparent 75%);
  -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 75%);
}
.page { position: relative; padding-right: var(--editor-w); transition: padding-right .25s ease; }

/* ---------- Header ---------- */
.hero {
  text-align: center;
  padding: clamp(28px, 6vw, 64px) var(--gutter) 12px;
}
.crest-wrap { position: relative; display: inline-block; }
.crest-wrap::before {
  content: "";
  position: absolute; inset: 12% 10%;
  background: radial-gradient(closest-side, rgba(124, 196, 234, 0.30), transparent);
  filter: blur(18px);
  z-index: -1;
}
.crest {
  display: block;
  width: min(380px, 72vw);
  height: auto;
  filter: drop-shadow(0 16px 30px rgba(0, 0, 0, 0.55));
}
.team-name {
  margin: 18px 0 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2.4rem, 8vw, 4.4rem);
  letter-spacing: 0.18em;
  line-height: 1.05;
  padding-left: 0.18em; /* balance trailing letter-spacing */
  background: linear-gradient(180deg, #ffffff 0%, var(--paper) 35%, var(--silver) 65%, var(--steel) 100%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  text-shadow: 0 2px 0 rgba(0,0,0,0.0);
  filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.55));
}
.tagline {
  margin: 10px 0 0;
  font-family: var(--font-display);
  font-weight: 600;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  font-size: clamp(0.72rem, 2.4vw, 0.9rem);
  color: var(--ice);
}
.divider {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  margin: 26px auto 0; max-width: 520px;
  color: var(--silver);
}
.divider::before, .divider::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, var(--line-strong));
}
.divider::after { background: linear-gradient(270deg, transparent, var(--line-strong)); }
.divider span { font-family: var(--font-display); font-size: .78rem; letter-spacing: .24em; text-transform: uppercase; color: var(--text-dim); white-space: nowrap; }

/* ---------- Roster grid ---------- */
.roster {
  max-width: 1240px;
  margin: 0 auto;
  padding: 28px var(--gutter) 56px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(218px, 1fr));
  gap: 20px;
}
@media (max-width: 560px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
}
@media (max-width: 300px) {
  .grid { grid-template-columns: 1fr; }
}

/* ---------- Card ---------- */
.card {
  position: relative;
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(19, 35, 90, 0.72), rgba(11, 20, 56, 0.88));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  transition: box-shadow .25s ease, border-color .25s ease, transform .25s ease;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}
.card:hover, .card:focus-visible, .card.is-open {
  border-color: rgba(169, 220, 245, 0.6);
  box-shadow: var(--glow);
}
@media (hover: hover) and (pointer: fine) {
  .card:hover { transform: translateY(-3px); }
}
.card.is-owner {
  border-color: rgba(195, 199, 207, 0.5);
  background:
    linear-gradient(180deg, rgba(169, 220, 245, 0.10), transparent 40%),
    linear-gradient(180deg, rgba(19, 35, 90, 0.8), rgba(11, 20, 56, 0.9));
}
.card.is-owner::before { /* thin ice line across the top */
  content: ""; position: absolute; left: 12px; right: 12px; top: -1px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--ice), transparent);
}

.card-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  min-height: 44px;
}
.name-block { min-width: 0; }
.player-name {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(0.92rem, 3.6vw, 1.12rem);
  letter-spacing: 0.04em;
  color: var(--paper);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rank {
  display: block;
  font-size: 0.66rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-dim);
  margin-top: 1px;
}
.owner-badge {
  display: inline-flex; align-items: center; gap: 5px;
  color: var(--ice);
}
.owner-badge svg { width: 14px; height: 14px; flex: none; }

.quips {
  flex: none;
  text-align: right;
  line-height: 1;
}
.quips-value {
  display: block;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(1.35rem, 5vw, 1.7rem);
  letter-spacing: 0.02em;
  color: var(--ice);
  text-shadow: 0 0 14px rgba(124, 196, 234, 0.45);
}
.quips-label {
  display: block; margin-top: 3px;
  font-size: 0.58rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--text-dim);
}
.quips[data-tier="high"] .quips-value { color: #d9f2ff; text-shadow: 0 0 16px rgba(169, 220, 245, 0.8); }
.quips[data-tier="low"] .quips-value { color: var(--silver); text-shadow: none; }
.quips.is-none .quips-value { color: var(--steel); text-shadow: none; }
.crown-mark {
  flex: none;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border: 1px solid rgba(169, 220, 245, 0.55);
  border-radius: 50%;
  color: var(--ice);
  background: radial-gradient(circle, rgba(169, 220, 245, 0.18), transparent 70%);
  box-shadow: 0 0 14px rgba(124, 196, 234, 0.35);
}
.crown-mark svg { width: 20px; height: 20px; }

.meter { /* rating bar under the header: 0.1 – 2.0 */
  height: 2px; margin: 8px 0 10px;
  background: rgba(195, 199, 207, 0.15);
  border-radius: 2px; overflow: hidden;
}
.meter i {
  display: block; height: 100%; width: var(--pct, 0%);
  background: linear-gradient(90deg, var(--ice-deep), var(--ice));
  box-shadow: 0 0 8px var(--ice-deep);
  transition: width .4s ease;
}
.card.is-owner .meter i { width: 100%; background: linear-gradient(90deg, var(--lavender), var(--silver), var(--ice)); box-shadow: none; }

/* The framed skin stage */
.stage {
  position: relative;
  aspect-ratio: 3 / 4;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  background:
    radial-gradient(ellipse 70% 55% at 50% 42%, rgba(124, 196, 234, 0.16), transparent 70%),
    linear-gradient(180deg, rgba(6, 11, 32, 0.35), rgba(6, 11, 32, 0.75));
  overflow: hidden;
  touch-action: pan-y; /* horizontal drags spin the model; vertical swipes still scroll */
  cursor: grab;
  user-select: none; -webkit-user-select: none;
}
.stage.is-dragging { cursor: grabbing; }
.stage::before, .stage::after { /* corner brackets */
  content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none; z-index: 2;
  border: 1px solid var(--silver);
  opacity: .75;
}
.stage::before { left: 5px; top: 5px; border-right: 0; border-bottom: 0; }
.stage::after { right: 5px; bottom: 5px; border-left: 0; border-top: 0; }
.stage .floor {
  position: absolute; left: 22%; right: 22%; bottom: 7%; height: 7%;
  background: radial-gradient(closest-side, rgba(0, 0, 0, 0.55), transparent);
  pointer-events: none;
}
.stage canvas, .stage img.flat {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
}
.stage img.flat { object-fit: contain; padding: 10% 14%; image-rendering: pixelated; }
.stage .loading {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  transition: opacity .3s ease;
}
.stage .loading::before {
  content: ""; width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid rgba(195, 199, 207, 0.2); border-top-color: var(--ice);
  animation: spin 0.9s linear infinite;
}
.stage.is-ready .loading { opacity: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
/* Bio: hover on desktop, tap on touch */
.bio {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
  padding: 26px 12px 12px;
  background: linear-gradient(180deg, transparent, rgba(6, 11, 32, 0.86) 26%, rgba(6, 11, 32, 0.95));
  font-size: 0.82rem; line-height: 1.45;
  color: var(--text);
  opacity: 0; transform: translateY(10px);
  transition: opacity .25s ease, transform .25s ease;
  pointer-events: none;
}
.bio p { margin: 0; }
.bio p::before { content: "“"; font-family: var(--font-display); color: var(--ice); font-size: 1.3em; line-height: 0; margin-right: 2px; vertical-align: -0.12em; }
.bio p::after { content: "”"; font-family: var(--font-display); color: var(--ice); font-size: 1.3em; line-height: 0; margin-left: 2px; vertical-align: -0.12em; }
.bio.is-placeholder p { color: var(--text-dim); font-style: italic; }
.card.is-open .bio, .card:focus-visible .bio { opacity: 1; transform: none; }
@media (hover: hover) and (pointer: fine) {
  .card:hover .bio { opacity: 1; transform: none; }
}
.tap-hint {
  position: absolute; right: 7px; bottom: 7px; z-index: 2;
  width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center;
  font: 700 12px/1 var(--font-display);
  color: var(--navy-900); background: var(--silver);
  opacity: .8; pointer-events: none;
  transition: opacity .2s ease;
}
@media (hover: hover) and (pointer: fine) { .tap-hint { display: none; } }
.card.is-open .tap-hint { opacity: 0; }

.card-title {
  margin: 10px 0 0;
  min-height: 1.5em;
  text-align: center;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(0.8rem, 3.2vw, 0.95rem);
  letter-spacing: 0.08em;
  color: var(--silver);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-title.is-placeholder { color: var(--steel); font-weight: 500; letter-spacing: .2em; text-transform: uppercase; font-size: .7rem; padding-top: .2em; }

@media (max-width: 560px) {
  .card { padding: 9px; }
  .card-head { min-height: 40px; }
  .crown-mark { width: 32px; height: 32px; }
  .crown-mark svg { width: 17px; height: 17px; }
  .bio { font-size: 0.74rem; padding: 22px 9px 9px; }
  .rank { font-size: .58rem; letter-spacing: .12em; }
}

.footer {
  text-align: center;
  padding: 0 var(--gutter) 40px;
  color: var(--text-dim);
  font-size: 0.78rem;
}
.footer strong { font-family: var(--font-display); letter-spacing: .14em; color: var(--silver); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}

/* ---------- Edit mode (only visible with ?edit in the URL) ---------- */
.editor {
  position: fixed; z-index: 50;
  top: 0; right: 0; bottom: 0;
  width: min(400px, 100vw);
  display: flex; flex-direction: column;
  background: #0a122f;
  border-left: 1px solid var(--line-strong);
  box-shadow: -20px 0 50px rgba(0, 0, 0, 0.45);
  font-size: 0.9rem;
  transition: transform .25s ease;
}
.editor.is-collapsed { transform: translateX(100%); }
.editor-head {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(28, 49, 116, 0.6), transparent);
}
.editor-head h2 { margin: 0; font-family: var(--font-display); font-size: 1.05rem; letter-spacing: .12em; color: var(--paper); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.editor-status { margin: 4px 0 0; font-size: .76rem; color: var(--text-dim); min-height: 1.2em; }
.editor-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.editor-body { flex: 1; overflow-y: auto; padding: 12px 16px 24px; overscroll-behavior: contain; }
.editor-notice {
  margin: 0 0 12px; padding: 10px 12px;
  border: 1px solid rgba(169, 220, 245, 0.45); border-radius: var(--radius);
  background: rgba(124, 196, 234, 0.08);
  font-size: .8rem;
}
.editor-notice[hidden] { display: none; }
.editor-notice .btn { margin-top: 8px; }
.editor-section-title { margin: 18px 0 8px; font-family: var(--font-display); font-size: .78rem; letter-spacing: .2em; text-transform: uppercase; color: var(--ice); }
.btn {
  appearance: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 36px; padding: 7px 12px;
  font: 600 .82rem/1.2 var(--font-body);
  color: var(--text);
  background: rgba(195, 199, 207, 0.08);
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  cursor: pointer;
}
.btn:hover { border-color: var(--ice); background: rgba(169, 220, 245, 0.12); }
.btn:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
.btn-primary { background: linear-gradient(180deg, #bfe6f9, var(--ice-deep)); color: var(--navy-900); border-color: transparent; }
.btn-primary:hover { background: linear-gradient(180deg, #d6f0fc, var(--ice)); border-color: transparent; }
.btn-danger { color: var(--danger); border-color: rgba(243, 154, 154, 0.45); }
.btn-danger:hover { border-color: var(--danger); background: rgba(243, 154, 154, 0.1); }
.btn-small { min-height: 30px; padding: 4px 10px; font-size: .76rem; }
.btn-wide { width: 100%; }
.member-row {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 8px;
  background: rgba(19, 35, 90, 0.35);
}
.member-row[open] { border-color: rgba(169, 220, 245, 0.5); background: rgba(19, 35, 90, 0.6); }
.member-row summary {
  list-style: none; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px;
  font-weight: 600;
}
.member-row summary::-webkit-details-marker { display: none; }
.member-row summary::before { content: "▸"; color: var(--steel); transition: transform .15s ease; }
.member-row[open] summary::before { transform: rotate(90deg); }
.member-row summary .sum-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.member-row summary .sum-meta { color: var(--ice); font-family: var(--font-display); font-weight: 700; }
.member-row summary .sum-warn { color: var(--danger); }
.fields { padding: 4px 12px 12px; display: grid; gap: 10px; }
.field label { display: block; font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; }
.field input[type="text"], .field input[type="number"], .field textarea {
  width: 100%;
  padding: 8px 10px;
  font: 500 16px/1.35 var(--font-body); /* 16px avoids iOS zoom-on-focus */
  color: var(--paper);
  background: rgba(6, 11, 32, 0.7);
  border: 1px solid var(--line-strong);
  border-radius: 4px;
}
.field textarea { min-height: 72px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--ice); box-shadow: 0 0 0 3px rgba(124, 196, 234, 0.2); }
.field.is-invalid input { border-color: var(--danger); }
.field .help { margin-top: 4px; font-size: .72rem; color: var(--text-dim); }
.field.is-invalid .help { color: var(--danger); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; align-items: center; gap: 8px; font-size: .84rem; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--ice-deep); }
.row-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.skin-status { font-size: .72rem; color: var(--text-dim); }
.skin-status.is-bad { color: var(--danger); }
.editor-fab {
  position: fixed; z-index: 49; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
  box-shadow: 0 8px 24px rgba(0,0,0,.5);
}
.editor-fab[hidden] { display: none; }
.toast {
  position: fixed; z-index: 60; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px);
  width: min(460px, calc(100vw - 32px));
  padding: 12px 14px;
  background: #0f1a47; color: var(--text);
  border: 1px solid var(--ice); border-radius: var(--radius);
  box-shadow: var(--glow);
  font-size: .84rem;
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;

      c.badgeSlot.appendChild(crown);
    } else {
      var q = el("div", "quips" + (hasRating ? "" : " is-none"));
      q.appendChild(el("span", "quips-value", hasRating ? fmtRating(m.rating) : "—"));
      q.appendChild(el("span", "quips-label", "Quips"));
      if (hasRating) q.dataset.tier = m.rating >= 1.5 ? "high" : (m.rating < 1.0 ? "low" : "mid");
      q.title = hasRating ? "Quips rating " + fmtRating(m.rating) + " (0.1 – 2.0)" : "No Quips rating";
      c.badgeSlot.appendChild(q);
    }
    c.meterFill.style.setProperty("--pct", hasRating ? Math.round(((m.rating - 0.1) / 1.9) * 100) + "%" : "0%");

    var title = m.title.trim();
    c.titleEl.textContent = title || state.team.name;
    c.titleEl.classList.toggle("is-placeholder", !title);
    var bio = m.bio.trim();
    c.bioText.textContent = bio || "Lets their sword do the talking.";
    c.bioEl.classList.toggle("is-placeholder", !bio);
    c.canvas.setAttribute("aria-label", "3D model of " + (m.name || "a player") + "'s Minecraft skin");
    c.el.setAttribute("aria-label", (m.name || "Unnamed") + (owner ? ", owner" : hasRating ? ", Quips " + fmtRating(m.rating) : "") + (title ? ", " + title : ""));

    var skin = skinNameOf(m);
    if (skin !== c.skinName) {
      c.skinName = skin;
      clearTimeout(c.skinTimer);
      if (immediate) applySkin(c);
      else c.skinTimer = setTimeout(function () { applySkin(c); }, 650); // wait until you stop typing
    }
  }

  function render(immediate) {
    document.getElementById("team-name").textContent = state.team.name;
    document.getElementById("footer-name").textContent = state.team.name.toUpperCase();
    var tag = document.getElementById("team-tagline");
    tag.textContent = state.team.tagline; tag.hidden = !state.team.tagline;
    var n = state.members.length;
    document.getElementById("member-count").textContent = "The Roster · " + n + (n === 1 ? " member" : " members");
    document.title = state.team.name + " · Legions";

    var sorted = sortMembers(state.members);
    var alive = {};
    // FLIP: remember where cards were so reordering animates smoothly
    var before = {};
    Object.keys(cardsById).forEach(function (id) { before[id] = cardsById[id].el.getBoundingClientRect(); });

    sorted.forEach(function (m, i) {
      var c = cardsById[m._id];
      var isNew = !c;
      if (isNew) c = cardsById[m._id] = createCard(m);
      alive[m._id] = true;
      updateCard(c, m, immediate || isNew);
      if (grid.children[i] !== c.el) grid.insertBefore(c.el, grid.children[i] || null);
    });
    Object.keys(cardsById).forEach(function (id) {
      if (!alive[id]) {
        var c = cardsById[id];
        if (io) io.unobserve(c.stage);
        if (ro) ro.unobserve(c.stage);
        if (c.tex) c.tex.dispose();
        c.el.remove();
        Engine.cards.splice(Engine.cards.indexOf(c), 1);
        delete cardsById[id];
        if (openCard === c) openCard = null;
      }
    });
    // keep the draw order matching the page order
    Engine.cards.sort(function (a, b) { return sorted.findIndex(function (m) { return m._id === a.id; }) - sorted.findIndex(function (m) { return m._id === b.id; }); });
    if (ro && Engine.cards[0]) { ro.disconnect(); ro.observe(Engine.cards[0].stage); }
    sizeEngine();

    if (!reduceMotion) {
      Object.keys(before).forEach(function (id) {
        var c = cardsById[id]; if (!c) return;
        var a = before[id], b = c.el.getBoundingClientRect();
        var dx = a.left - b.left, dy = a.top - b.top;
        if (!dx && !dy) return;
        c.el.style.transition = "none";
        c.el.style.transform = "translate(" + dx + "px," + dy + "px)";
        requestAnimationFrame(function () {
          c.el.style.transition = "transform .35s ease, box-shadow .25s ease, border-color .25s ease";
          c.el.style.transform = "";
          setTimeout(function () { c.el.style.transition = ""; }, 400);
        });
      });
    }
  }

  // tap outside an open card closes its bio
  document.addEventListener("pointerdown", function (e) {
    if (openCard && !openCard.el.contains(e.target)) setOpen(openCard, false);
  });

  /* ---------------- Edit mode ---------------- */
  var Editor = { focusMember: null };

  function initEditor() {
    document.body.classList.add("editing", "editor-open");
    var draft = null;
    try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch (e) { draft = null; }
    var notice = "";
    if (draft && draft.data) {
      var restored = normalize(draft.data);
      if (plain(restored) === plain(BAKED)) {
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      } else {
        state = restored;
        var when = new Date(draft.savedAt || Date.now());
        notice = "Restored your unsaved edits from " + when.toLocaleString() + ".";
        if (draft.base && draft.base !== hash(plain(BAKED))) notice += " Heads up: the published site has changed since these edits were made.";
      }
    }

    var flag = el("div", "edit-flag", "Edit mode");
    document.body.appendChild(flag);

    var panel = el("aside", "editor");
    panel.setAttribute("aria-label", "Site editor");
    panel.innerHTML =
      '<div class="editor-head">' +
        '<h2><span>Edit roster</span><button type="button" class="btn btn-small" data-act="close">Hide</button></h2>' +
        '<p class="editor-status" data-ref="status">Changes preview instantly. Nothing is public until you upload.</p>' +
        '<div class="editor-actions">' +
          '<button type="button" class="btn btn-primary" data-act="download">⬇ Download updated site</button>' +
          '<button type="button" class="btn" data-act="add">+ Add member</button>' +
        '</div>' +
      '</div>' +
      '<div class="editor-body">' +
        '<div class="editor-notice" data-ref="notice" hidden><span data-ref="notice-text"></span><br>' +
          '<button type="button" class="btn btn-small btn-danger" data-act="discard">Discard my edits</button></div>' +
        '<h3 class="editor-section-title">Team</h3>' +
        '<div class="fields" style="padding:0">' +
          '<div class="field"><label for="ed-team-name">Team name</label><input type="text" id="ed-team-name" maxlength="40"></div>' +
          '<div class="field"><label for="ed-team-tag">Tagline</label><input type="text" id="ed-team-tag" maxlength="80"></div>' +
        '</div>' +
        '<h3 class="editor-section-title">Members <span style="color:var(--text-dim);letter-spacing:0;text-transform:none;font-family:var(--font-body);font-weight:500">— click a card to jump to it</span></h3>' +
        '<div data-ref="list"></div>' +
        '<button type="button" class="btn btn-wide" data-act="add">+ Add member</button>' +
      '</div>';
    document.body.appendChild(panel);
    var fab = el("button", "btn btn-primary editor-fab", "✎ Editor");
    fab.type = "button"; fab.hidden = true;
    document.body.appendChild(fab);

    var $ = function (ref) { return panel.querySelector('[data-ref="' + ref + '"]'); };
    var list = $("list"), statusEl = $("status");
    var rows = {};

    if (notice) { $("notice").hidden = false; $("notice-text").textContent = notice; }

    function setPanel(open) {
      panel.classList.toggle("is-collapsed", !open);
      document.body.classList.toggle("editor-open", open);
      fab.hidden = open;
      setTimeout(sizeEngine, 300);
    }
    fab.addEventListener("click", function () { setPanel(true); });

    var saveTimer = null;
    function changed() {
      render(false);
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveDraft, 250);
    }
    function saveDraft() {
      try {
        if (plain(state) === plain(BAKED)) { localStorage.removeItem(DRAFT_KEY); statusEl.textContent = "No unsaved changes."; return; }
        localStorage.setItem(DRAFT_KEY, JSON.stringify({ savedAt: Date.now(), base: hash(plain(BAKED)), data: stripIds(state) }));
        statusEl.textContent = "Draft saved in this browser · " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + ". Download & upload to publish.";
      } catch (e) {
        statusEl.textContent = "Couldn't save a draft in this browser (private mode?). Download before closing.";
      }
    }

    var teamName = panel.querySelector("#ed-team-name"), teamTag = panel.querySelector("#ed-team-tag");
    function fillTeam() { teamName.value = state.team.name; teamTag.value = state.team.tagline; }
    fillTeam();
    teamName.addEventListener("input", function () { state.team.name = teamName.value.trim() || "Vanguard"; changed(); });
    teamTag.addEventListener("input", function () { state.team.tagline = teamTag.value; changed(); });

    function field(labelText, input, help) {
      var f = el("div", "field");
      var id = "ed-" + Math.random().toString(36).slice(2, 9);
      var l = el("label", null, labelText); l.htmlFor = id; input.id = id;
      f.appendChild(l); f.appendChild(input);
      if (help !== undefined) { f.helpEl = el("div", "help", help); f.appendChild(f.helpEl); }
      return f;
    }
    function textInput(value, max) { var i = el("input"); i.type = "text"; i.value = value; i.maxLength = max || 60; i.autocomplete = "off"; i.spellcheck = false; return i; }

    function buildRow(m, open) {
      var d = el("details", "member-row");
      if (open) d.open = true;
      var sum = el("summary");
      var sName = el("span", "sum-name"), sMeta = el("span", "sum-meta"), sWarn = el("span", "sum-warn");
      sum.appendChild(sName); sum.appendChild(sWarn); sum.appendChild(sMeta);
      d.appendChild(sum);
      var box = el("div", "fields");

      var name = textInput(m.name, 32);
      var skin = textInput(m.skin, 16); skin.placeholder = "Same as name";
      var title = textInput(m.title, 40); title.placeholder = 'e.g. "The Lion"';
      var rating = el("input"); rating.type = "number"; rating.step = "0.1"; rating.min = "0.1"; rating.max = "2.0"; rating.inputMode = "decimal";
      rating.value = m.rating === null ? "" : String(m.rating); rating.placeholder = "none";
      var bio = el("textarea"); bio.value = m.bio; bio.maxLength = 220; bio.rows = 3; bio.placeholder = "A short bio or quote (shown on hover / tap)";
      var ownerBox = el("label", "check"); var owner = el("input"); owner.type = "checkbox"; owner.checked = m.owner;
      ownerBox.appendChild(owner); ownerBox.appendChild(document.createTextNode("Owner (crown badge, always first, no rating)"));

      var fName = field("Name on card", name);
      var fSkin = field("Minecraft username (skin)", skin, "");
      var fTitle = field("Title", title);
      var fRating = field("Quips rating", rating, "0.1 – 2.0, blank = none");
      var fBio = field("Bio / quote", bio);
      var pair = el("div", "field-row"); pair.appendChild(fTitle); pair.appendChild(fRating);
      box.appendChild(fName); box.appendChild(fSkin); box.appendChild(pair); box.appendChild(fBio); box.appendChild(ownerBox);

      var foot = el("div", "row-foot");
      var skinStatus = el("span", "skin-status", "");
      var del = el("button", "btn btn-small btn-danger", "Remove member"); del.type = "button";
      foot.appendChild(skinStatus); foot.appendChild(del);
      box.appendChild(foot);
      d.appendChild(box);

      function refreshSummary() {
        sName.textContent = m.name || "(no name)";
        sMeta.textContent = m.owner ? "♛" : (m.rating === null ? "—" : fmtRating(m.rating));
        sWarn.textContent = (rowErrors(m).length ? "⚠" : "");
        fRating.hidden = false;
        rating.disabled = m.owner;
        fRating.classList.toggle("is-invalid", !m.owner && !ratingValid(m.rating));
        fRating.helpEl.textContent = m.owner ? "Owners have no rating" : (!ratingValid(m.rating) ? "Must be between 0.1 and 2.0 (or blank)" : "0.1 – 2.0, blank = none");
        var sn = skinNameOf(m);
        var nameOk = /^[A-Za-z0-9_]{3,16}$/.test(sn);
        fSkin.classList.toggle("is-invalid", !nameOk);
        fSkin.helpEl.textContent = nameOk ? "Skin updates automatically when they change it in-game." : "Minecraft usernames are 3–16 letters, numbers or _";
      }
      refreshSummary();

      name.addEventListener("input", function () { m.name = name.value; refreshSummary(); changed(); });
      skin.addEventListener("input", function () { m.skin = skin.value.trim(); skinStatus.textContent = "Loading skin…"; skinStatus.classList.remove("is-bad"); refreshSummary(); changed(); });
      title.addEventListener("input", function () { m.title = title.value; changed(); });
      rating.addEventListener("input", function () {
        var raw = rating.value.trim().replace(",", ".");
        m.rating = raw === "" ? null : Number(raw);
        if (raw !== "" && isNaN(m.rating)) m.rating = NaN;
        refreshSummary(); changed();
      });
      bio.addEventListener("input", function () { m.bio = bio.value; changed(); });
      owner.addEventListener("change", function () { m.owner = owner.checked; refreshSummary(); changed(); });
      del.addEventListener("click", function () {
        if (!confirm("Remove " + (m.name || "this member") + " from the roster?")) return;
        state.members.splice(state.members.indexOf(m), 1);
        d.remove(); delete rows[m._id];
        changed();
      });
      d.addEventListener("toggle", function () {
        Engine.cards.forEach(function (c) { c.el.classList.toggle("is-selected", d.open && c.id === m._id); });
      });

      rows[m._id] = { el: d, name: name, statusEl: skinStatus };
      return d;
    }

    function hookSkinStatus(m) {
      var c = cardsById[m._id], r = rows[m._id];
      if (!c || !r) return;
      var show = function (src) {
        r.statusEl.textContent = src === "default" ? "Skin not found — showing default skin" : "Skin loaded from " + src;
        r.statusEl.classList.toggle("is-bad", src === "default");
      };
      c.onSkinStatus = show;
      if (c.source) show(c.source);
    }

    function buildList() {
      list.innerHTML = ""; rows = {};
      sortMembers(state.members).forEach(function (m) { list.appendChild(buildRow(m, false)); });
      state.members.forEach(hookSkinStatus);
    }

    Editor.focusMember = function (id) {
      var r = rows[id]; if (!r) return;
      setPanel(true);
      Object.keys(rows).forEach(function (k) { if (rows[k] !== r) rows[k].el.open = false; });
      r.el.open = true;
      r.el.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
    };

    function addMember() {
      var m = normalizeMember({ name: "NewMember", skin: "", title: "", rating: 1.0, bio: "" });
      state.members.push(m);
      changed();
      var row = buildRow(m, true);
      list.appendChild(row);
      hookSkinStatus(m);
      Editor.focusMember(m._id);
      rows[m._id].name.focus(); rows[m._id].name.select();
    }

    panel.addEventListener("click", function (e) {
      var b = e.target.closest("[data-act]"); if (!b) return;
      var act = b.getAttribute("data-act");
      if (act === "close") setPanel(false);
      if (act === "add") addMember();
      if (act === "download") downloadSite();
      if (act === "discard") {
        if (!confirm("Throw away your unsaved edits and go back to the published version?")) return;
        try { localStorage.removeItem(DRAFT_KEY); } catch (err) {}
        state = normalize(stripIds(BAKED));
        $("notice").hidden = true;
        fillTeam(); render(true); buildList();
        statusEl.textContent = "Back to the published version.";
      }
    });

    function downloadSite() {
      var problems = [];
      state.members.forEach(function (m) { rowErrors(m).forEach(function (p) { problems.push((m.name || "(no name)") + ": " + p); }); });
      if (problems.length) { alert("Please fix these first:\n\n" + problems.join("\n")); return; }
      getSource().then(function (src) {
        var a = src.indexOf(MARK_START), b = src.indexOf(MARK_END);
        if (a < 0 || b < a) throw new Error("data markers not found");
        var lineEnd = src.indexOf("\n", a);
        var out = src.slice(0, lineEnd + 1) + serialize(state) + "\n" + src.slice(b);
        var blob = new Blob([out], { type: "text/html;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var link = el("a"); link.href = url; link.download = "index.html";
        document.body.appendChild(link); link.click(); link.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        toast("Saved <b>index.html</b>. Now upload it to your GitHub repository (Add file → Upload files → Commit changes). The site updates in about a minute.", 9000);
      }).catch(function (err) {
        alert("Sorry, the download failed: " + err.message);
      });
    }

    render(true);
    buildList();
    if (!notice) saveDraft();
  }

  function rowErrors(m) {
    var out = [];
    if (!m.name.trim()) out.push("name is empty");
    if (!m.owner && !ratingValid(m.rating)) out.push("rating must be 0.1 – 2.0 or blank");
    return out;
  }
  function stripIds(data) {
    return { team: { name: data.team.name, tagline: data.team.tagline }, members: data.members.map(function (m) { return { name: m.name, skin: m.skin, title: m.title, rating: m.rating, owner: m.owner, bio: m.bio }; }) };
  }
  function hash(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return String(h >>> 0); }

  /* The page's own file: fetched fresh from GitHub Pages, or the startup snapshot as a fallback. */
  function getSource() {
    var valid = function (s) { return s && s.indexOf(MARK_START) >= 0 && s.indexOf(MARK_END) >= 0; };
    if (location.protocol === "file:") return Promise.resolve(PAGE_SNAPSHOT);
    return fetch(location.href.split(/[?#]/)[0], { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : ""; })
      .then(function (s) { return valid(s) ? s : PAGE_SNAPSHOT; }, function () { return PAGE_SNAPSHOT; });
  }

  var toastEl = null, toastTimer = null;
  function toast(html, ms) {
    if (!toastEl) { toastEl = el("div", "toast"); toastEl.setAttribute("role", "status"); document.body.appendChild(toastEl); }
    toastEl.innerHTML = html;
    toastEl.classList.add("is-on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("is-on"); }, ms || 5000);
  }

  /* ---------------- Start ---------------- */
  if (EDIT_MODE) {
    state = normalize(stripIds(BAKED)); // editable copy
    initEditor();
  } else {
    render(true);
  }
  initEngine();
})();
</script>
</body>
</html>
